<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=160、height=160 控制导出尺寸，viewBox=0 0 160 160 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品评价与个人中心随机头像资源之二。
    修改指引：可调整衣领与头发颜色形成差异化，建议保留浅色背景以保证字迹可读。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=160/height=160 设定大小，rx=48 控制圆角弧度，fill=#fff5eb 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="160" height="160" rx="48" fill="#fff5eb" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=80/cy=66 设置圆心坐标，r=34 控制半径，fill=#de8c34 调整填充色 -->
  <circle cx="80" cy="66" r="34" fill="#de8c34" opacity="0.7" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#f2c572 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M32 132c12-30 32-46 48-46s36 16 48 46" fill="#f2c572" opacity="0.8" />
</svg>
