<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品评价与个人中心随机头像资源之三。
    修改指引：替换面部或背景颜色时请保持描边一致，确保头像风格统一。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <rect width="160" height="160" rx="48" fill="#eef1ff" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="80" cy="68" r="32" fill="#6d74dd" opacity="0.7" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M34 132c10-28 30-44 46-44s36 16 46 44" fill="#a3a7f7" opacity="0.8" />
</svg>
