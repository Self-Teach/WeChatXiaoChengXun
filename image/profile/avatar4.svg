<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品评价与个人中心随机头像资源之四。
    修改指引：如需改造配色请统一调整 fill 属性，保留圆角矩形背景以与其他头像一致。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <rect width="160" height="160" rx="48" fill="#fdeff5" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="80" cy="68" r="32" fill="#d94b9c" opacity="0.7" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M36 132c12-30 30-44 44-44s32 14 44 44" fill="#f5a9d2" opacity="0.8" />
</svg>
