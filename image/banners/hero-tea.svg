<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=360、height=360 控制导出尺寸，viewBox=0 0 360 360 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：精选页顶部横幅插画，营造品牌氛围。
    修改指引：可替换山峦、茶杯等路径颜色形成新主题，务必保持视窗比率以避免拉伸。
  -->
  <!-- <defs> 节点用于存放渐变或滤镜等复用资源，不使用时可整块删除 -->
  <defs>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <!-- 定义线性渐变 bg，x1/y1 与 x2/y2 控制光线方向，适当修改可调节高光位置 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=0% 决定过渡百分比，stop-color=#f4f9f6 设置该处颜色，可结合品牌色调整 -->
      <stop offset="0%" stop-color="#f4f9f6" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=100% 决定过渡百分比，stop-color=#d7f1e4 设置该处颜色，可结合品牌色调整 -->
      <stop offset="100%" stop-color="#d7f1e4" />
    </linearGradient>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <!-- 定义线性渐变 cup，x1/y1 与 x2/y2 控制光线方向，适当修改可调节高光位置 -->
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=0% 决定过渡百分比，stop-color=#f2c572 设置该处颜色，可结合品牌色调整 -->
      <stop offset="0%" stop-color="#f2c572" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=100% 决定过渡百分比，stop-color=#de8c34 设置该处颜色，可结合品牌色调整 -->
      <stop offset="100%" stop-color="#de8c34" />
    </linearGradient>
  </defs>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=360/height=360 设定大小，rx=48 控制圆角弧度，fill=url(#bg) 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="360" height="360" rx="48" fill="url(#bg)" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=220/cy=120 设置圆心坐标，r=60 控制半径，fill=#0a8a4a 调整填充色 -->
  <circle cx="220" cy="120" r="60" fill="#0a8a4a" opacity="0.12" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=140/cy=220 设置圆心坐标，r=90 控制半径，fill=#0a8a4a 调整填充色 -->
  <circle cx="140" cy="220" r="90" fill="#0a8a4a" opacity="0.08" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0a8a4a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M96 220h168c0 46-38 84-84 84s-84-38-84-84z" fill="#0a8a4a" opacity="0.14" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#ffffff 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M126 160h108v54c0 40-32 72-54 72s-54-32-54-72z" fill="#ffffff" />
  <ellipse cx="180" cy="214" rx="54" ry="18" fill="#0a8a4a" opacity="0.08" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=url(#cup) 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M138 178h84v28c0 18-16 32-42 32s-42-14-42-32z" fill="url(#cup)" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M144 150c0-12 14-18 14-30 0-10-10-16-10-24 0-6 4-10 10-12" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M192 150c0-12 14-18 14-30 0-10-10-16-10-24 0-6 4-10 10-12" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=258/cy=226 设置圆心坐标，r=32 控制半径，fill=#ffffff 调整填充色 -->
  <circle cx="258" cy="226" r="32" fill="#ffffff" opacity="0.6" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=108/cy=142 设置圆心坐标，r=18 控制半径，fill=#ffffff 调整填充色 -->
  <circle cx="108" cy="142" r="18" fill="#ffffff" opacity="0.6" />
</svg>
