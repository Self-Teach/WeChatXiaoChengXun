<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=120、height=120 控制导出尺寸，viewBox=0 0 120 120 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：知识页“存储事项”卡片图标。
    修改指引：如需调整阴影或罐体颜色请修改对应路径的 fill，保持 120×120 尺寸兼容布局。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=34/y=24 定位左上角，width=52/height=76 设定大小，rx=16 控制圆角弧度，fill=#f0f7f4 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect x="34" y="24" width="52" height="76" rx="16" fill="#f0f7f4" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0a8a4a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M44 44h32v12H44z" fill="#0a8a4a" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#13b067 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M44 68h32v12H44z" fill="#13b067" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M52 24V14h20v10" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" />
</svg>
