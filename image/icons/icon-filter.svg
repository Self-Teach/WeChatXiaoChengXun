<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=48、height=48 控制导出尺寸，viewBox=0 0 48 48 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：首页筛选按钮的滤网图标。
    修改指引：可替换线条颜色以配合主题色，保持 stroke-width=4 才能在卡片上清晰呈现。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M12 14H36" stroke="#0A8A4A" stroke-width="4" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13B067 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M18 24H30" stroke="#13B067" stroke-width="4" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M22 34H26" stroke="#0A8A4A" stroke-width="4" stroke-linecap="round"/>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=20/y=26 定位左上角，width=8/height=10 设定大小，rx=2 控制圆角弧度，fill=#CFF3DE 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect x="20" y="26" width="8" height="10" rx="2" fill="#CFF3DE" opacity="0.7"/>
</svg>
