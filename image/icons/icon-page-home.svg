<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=96、height=96 控制导出尺寸，viewBox=0 0 96 96 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：底部导航“精选”标签的首页图标。
    修改指引：若需换色请同时更新屋顶与底座的 fill，画布尺寸 96×96 不宜调整以兼容 tabbar。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=96/height=96 设定大小，rx=24 控制圆角弧度，fill=#E5F7ED 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="96" height="96" rx="24" fill="#E5F7ED"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0A8A4A 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M48 25L22 44.5V72H38V56H58V72H74V44.5L48 25Z" fill="#0A8A4A"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=white 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M41 45H55C55.5523 45 56 45.4477 56 46V55H40V46C40 45.4477 40.4477 45 41 45Z" fill="white" fill-opacity="0.7"/>
</svg>
