<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=96、height=96 控制导出尺寸，viewBox=0 0 96 96 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：底部导航“购物车”标签的本地图标。
    修改指引：修改购物车主体颜色时请同时更新两个 <path> 的 fill，保持 96×96 画布以与 tabbar 对齐。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=96/height=96 设定大小，rx=24 控制圆角弧度，fill=#FFF4E6 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="96" height="96" rx="24" fill="#FFF4E6"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#E08B22 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M28 28H33.2C34.6667 28 35.8667 29.0533 36.1333 30.4933L38 40H69C71.2 40 72.8 42.0533 72.2667 44.1867L68.8 58.1867C68.4 59.8133 66.9333 61 65.2667 61H41.3333C39.6 61 38.1333 59.7467 37.8 58.04L33.8667 38H28C26.8954 38 26 37.1046 26 36V30C26 28.8954 26.8954 28 28 28Z" fill="#E08B22"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=44/cy=68 设置圆心坐标，r=6 控制半径，fill=#E08B22 调整填充色 -->
  <circle cx="44" cy="68" r="6" fill="#E08B22"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=64/cy=68 设置圆心坐标，r=6 控制半径，fill=#E08B22 调整填充色 -->
  <circle cx="64" cy="68" r="6" fill="#E08B22"/>
</svg>
