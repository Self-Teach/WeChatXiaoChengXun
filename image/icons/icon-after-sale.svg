<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=120、height=120 控制导出尺寸，viewBox=0 0 120 120 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：订单页“退款/售后”入口的循环箭头图标。
    修改指引：如需换色请同步调整圆环与箭头的描边颜色，保持 6 像素线宽确保箭头清晰。
  -->
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=60/cy=60 设置圆心坐标，r=54 控制半径，fill=#e8f6f0 调整填充色 -->
  <circle cx="60" cy="60" r="54" fill="#e8f6f0" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状，stroke-linejoin=round 决定转角圆滑程度；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M78 38h18v18" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状，stroke-linejoin=round 决定转角圆滑程度；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M42 82H24V64" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13b067 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M82 38L38 82" stroke="#13b067" stroke-width="6" stroke-linecap="round" />
</svg>
