<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：茶叶知识页“茶艺文化”章节的主题图标。
    修改指引：可替换扇面或茶杯路径颜色，保持 64×64 画布与圆形轮廓以维持版式统一。
  -->
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="32" cy="32" r="30" fill="#F1F8F3" stroke="#0A8A4A" stroke-width="2"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M18 28C21.5 24 26.5 22 32 22C37.5 22 42.5 24 46 28" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M22 34H42" stroke="#13B067" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M24 40C26 43 28.5 45 32 45C35.5 45 38 43 40 40" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="22" cy="20" r="4" fill="#13B067"/>
</svg>
