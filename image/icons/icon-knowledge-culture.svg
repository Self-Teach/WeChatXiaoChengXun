<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=64、height=64 控制导出尺寸，viewBox=0 0 64 64 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：茶叶知识页“茶艺文化”章节的主题图标。
    修改指引：可替换扇面或茶杯路径颜色，保持 64×64 画布与圆形轮廓以维持版式统一。
  -->
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=32/cy=32 设置圆心坐标，r=30 控制半径，fill=#F1F8F3 调整填充色，stroke=#0A8A4A 配合 stroke-width=2 决定描边表现 -->
  <circle cx="32" cy="32" r="30" fill="#F1F8F3" stroke="#0A8A4A" stroke-width="2"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M18 28C21.5 24 26.5 22 32 22C37.5 22 42.5 24 46 28" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13B067 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M22 34H42" stroke="#13B067" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M24 40C26 43 28.5 45 32 45C35.5 45 38 43 40 40" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=22/cy=20 设置圆心坐标，r=4 控制半径，fill=#13B067 调整填充色 -->
  <circle cx="22" cy="20" r="4" fill="#13B067"/>
</svg>
