<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=56、height=56 控制导出尺寸，viewBox=0 0 56 56 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：知识页“茶叶形态”提示图标。
    修改指引：更换配色可直接修改两片叶子的 fill，保留 56×56 画布与叠叶结构以呼应文案。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#CFF3DE 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M14 40C14 24 24 14 40 14C40 30 30 40 14 40Z" fill="#CFF3DE"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M14 40C14 24 24 14 40 14" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13B067 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M22 30C26 30 30 34 30 38" stroke="#13B067" stroke-width="3" stroke-linecap="round"/>
</svg>
