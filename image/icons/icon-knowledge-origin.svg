<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=120、height=120 控制导出尺寸，viewBox=0 0 120 120 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：茶叶知识页“主要产地”卡片的地标标识。
    修改指引：修改山体或定位点颜色时请一并调整 fill 属性，避免与卡片背景撞色。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#f5f0e6 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M60 16C42 16 28 30 28 48c0 18 12 36 32 54 20-18 32-36 32-54 0-18-14-32-32-32z" fill="#f5f0e6" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=60/cy=48 设置圆心坐标，r=16 控制半径，fill=#c9791f 调整填充色 -->
  <circle cx="60" cy="48" r="16" fill="#c9791f" />
</svg>
