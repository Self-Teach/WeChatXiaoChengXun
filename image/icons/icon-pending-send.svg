<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=120、height=120 控制导出尺寸，viewBox=0 0 120 120 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：订单页“待发货”标签的信封图标。
    修改指引：如需调整色彩请同步修改信封主体与轮廓的 fill/stroke，保持描边宽度 6 维持识别度。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=16/y=32 定位左上角，width=88/height=56 设定大小，rx=16 控制圆角弧度，fill=#f0f7f4 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect x="16" y="32" width="88" height="56" rx="16" fill="#f0f7f4" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0a8a4a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M32 46h44l16 16v16H32z" fill="#0a8a4a" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#ffffff 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状，stroke-linejoin=round 决定转角圆滑程度；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M76 46v16h16" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=44/cy=90 设置圆心坐标，r=6 控制半径，fill=#ffffff 调整填充色 -->
  <circle cx="44" cy="90" r="6" fill="#ffffff" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=80/cy=90 设置圆心坐标，r=6 控制半径，fill=#ffffff 调整填充色 -->
  <circle cx="80" cy="90" r="6" fill="#ffffff" />
</svg>
