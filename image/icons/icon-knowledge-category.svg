<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=120、height=120 控制导出尺寸，viewBox=0 0 120 120 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：知识页“茶类速览”分类卡片图标。
    修改指引：可替换叶片或背景渐变色，保持三片叶子组合结构以突出分类主题。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#e8f6f0 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M24 70c0-20 16-36 36-36s36 16 36 36v12a14 14 0 0 1-14 14H38a14 14 0 0 1-14-14z" fill="#e8f6f0" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0a8a4a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M60 34c-14 0-24 10-24 24v20a6 6 0 0 0 6 6h36a6 6 0 0 0 6-6V58c0-14-10-24-24-24z" fill="#0a8a4a" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#ffffff 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M52 58c4-6 10-9 18-9" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
</svg>
