<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=96、height=96 控制导出尺寸，viewBox=0 0 96 96 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：底部导航“科普”标签的书页图标。
    修改指引：替换主色时需同步修改书本与书签路径填充，维持 96×96 画布保证清晰。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=96/height=96 设定大小，rx=24 控制圆角弧度，fill=#E9F3FF 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="96" height="96" rx="24" fill="#E9F3FF"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#2F74FF 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M28 30H68C71.3137 30 74 32.6863 74 36V66C74 66.5523 73.5523 67 73 67H54L48 72L42 67H23C22.4477 67 22 66.5523 22 66V36C22 32.6863 24.6863 30 28 30Z" fill="#2F74FF"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=white 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M34 38H62" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=white 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M34 48H62" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=white 配合 stroke-width=4 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M34 58H50" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
