<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：知识页“海拔特征”提示图标。
    修改指引：调整山峰或太阳颜色时需同步修改 fill，建议保留白色高光以体现层次。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M10 40L22 24L32 34L40 26L46 34" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M10 40H46" stroke="#13B067" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="32" cy="14" r="6" fill="#CFF3DE" stroke="#0A8A4A" stroke-width="2"/>
</svg>
