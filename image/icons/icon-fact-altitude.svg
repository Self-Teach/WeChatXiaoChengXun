<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=56、height=56 控制导出尺寸，viewBox=0 0 56 56 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：知识页“海拔特征”提示图标。
    修改指引：调整山峰或太阳颜色时需同步修改 fill，建议保留白色高光以体现层次。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状，stroke-linejoin=round 决定转角圆滑程度；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M10 40L22 24L32 34L40 26L46 34" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13B067 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M10 40H46" stroke="#13B067" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=32/cy=14 设置圆心坐标，r=6 控制半径，fill=#CFF3DE 调整填充色，stroke=#0A8A4A 配合 stroke-width=2 决定描边表现 -->
  <circle cx="32" cy="14" r="6" fill="#CFF3DE" stroke="#0A8A4A" stroke-width="2"/>
</svg>
