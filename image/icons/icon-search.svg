<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：首页搜索输入框左侧的放大镜图标。
    修改指引：可调整外圈描边与镜片填充颜色，保持 48×48 画布与圆角造型以贴合输入框样式。
  -->
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="22" cy="22" r="12" stroke="#0A8A4A" stroke-width="3" fill="none"/>
  <line x1="30.5" y1="30.5" x2="40" y2="40" stroke="#0A8A4A" stroke-width="3" stroke-linecap="round"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="22" cy="22" r="7" fill="#CFF3DE" opacity="0.6"/>
</svg>
