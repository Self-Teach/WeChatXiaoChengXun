<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=48、height=48 控制导出尺寸，viewBox=0 0 48 48 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：个人中心地址管理入口图标。
    修改指引：可调整定位水滴与圆心的颜色，保持 48×48 画布与滴形轮廓以契合当前卡片风格。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#CFF3DE 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=2 调整线条颜色与粗细；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M24 6C17.4 6 12 11.4 12 18C12 27 24 42 24 42C24 42 36 27 36 18C36 11.4 30.6 6 24 6Z" fill="#CFF3DE" stroke="#0A8A4A" stroke-width="2"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=24/cy=18 设置圆心坐标，r=5 控制半径，fill=#13B067 调整填充色 -->
  <circle cx="24" cy="18" r="5" fill="#13B067"/>
</svg>
