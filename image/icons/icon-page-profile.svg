<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=96、height=96 控制导出尺寸，viewBox=0 0 96 96 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：底部导航“我的”标签的本地图标。
    修改指引：如需替换主色请同步调整外圈与头像路径的 fill，确保在浅色背景上仍有对比度。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=96/height=96 设定大小，rx=24 控制圆角弧度，fill=#F3ECFF 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="96" height="96" rx="24" fill="#F3ECFF"/>
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=48/cy=38 设置圆心坐标，r=16 控制半径，fill=#6E4BCE 调整填充色 -->
  <circle cx="48" cy="38" r="16" fill="#6E4BCE"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#6E4BCE 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M24 72C24 58.7452 34.7452 48 48 48C61.2548 48 72 58.7452 72 72H24Z" fill="#6E4BCE"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=white 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M48 32C44.6863 32 42 34.6863 42 38C42 41.3137 44.6863 44 48 44C51.3137 44 54 41.3137 54 38C54 34.6863 51.3137 32 48 32Z" fill="white" fill-opacity="0.7"/>
</svg>
