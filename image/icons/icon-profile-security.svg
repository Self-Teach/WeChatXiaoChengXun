<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=48、height=48 控制导出尺寸，viewBox=0 0 48 48 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：个人中心-账号与安全入口的小盾牌图标。
    修改指引：可调节盾牌填充与勾形线条颜色，保持描边宽度 2-3 以确保在小尺寸上清晰。
  -->
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#F1F8F3 控制内部颜色，stroke=#0A8A4A 配合 stroke-width=2 调整线条颜色与粗细；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M24 6L10 12V22C10 30.4 16 38.2 24 40C32 38.2 38 30.4 38 22V12L24 6Z" fill="#F1F8F3" stroke="#0A8A4A" stroke-width="2"/>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#13B067 配合 stroke-width=3 调整线条颜色与粗细，stroke-linecap=round 控制端点形状，stroke-linejoin=round 决定转角圆滑程度；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M18 24L22 28L30 20" stroke="#13B067" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
