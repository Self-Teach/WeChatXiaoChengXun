<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=320、height=320 控制导出尺寸，viewBox=0 0 320 320 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：茶叶精选分类中“滇绿”商品主图。
    修改指引：可替换茶汤与茶罐颜色打造新款式，保持 320×320 画布避免在列表中变形。
  -->
  <!-- <defs> 节点用于存放渐变或滤镜等复用资源，不使用时可整块删除 -->
  <defs>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <!-- 定义线性渐变 leaf，x1/y1 与 x2/y2 控制光线方向，适当修改可调节高光位置 -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=0% 决定过渡百分比，stop-color=#8ed694 设置该处颜色，可结合品牌色调整 -->
      <stop offset="0%" stop-color="#8ed694" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=100% 决定过渡百分比，stop-color=#0a8a4a 设置该处颜色，可结合品牌色调整 -->
      <stop offset="100%" stop-color="#0a8a4a" />
    </linearGradient>
  </defs>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=320/height=320 设定大小，rx=40 控制圆角弧度，fill=#f1fbf4 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="320" height="320" rx="40" fill="#f1fbf4" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=160/cy=160 设置圆心坐标，r=108 控制半径，fill=#d5f1dd 调整填充色 -->
  <circle cx="160" cy="160" r="108" fill="#d5f1dd" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=url(#leaf) 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M160 80c48 36 72 80 32 160-48-36-72-80-32-160z" fill="url(#leaf)" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=8 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M140 128c-28 44-28 92 12 120" stroke="#0a8a4a" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
