<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=360、height=240 控制导出尺寸，viewBox=0 0 360 240 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="360" height="240" viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品详情页“器具搭配”模块的茶具插图。
    修改指引：如需调整茶具颜色请同步更新多个 <path> 的 fill，维持柔和阴影以保持质感。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=360/height=240 设定大小，rx=32 控制圆角弧度，fill=#f6f8f4 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="360" height="240" rx="32" fill="#f6f8f4" />
  <ellipse cx="180" cy="180" rx="140" ry="32" fill="#d8e7dc" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=120/cy=128 设置圆心坐标，r=52 控制半径，fill=#0a8a4a 调整填充色 -->
  <circle cx="120" cy="128" r="52" fill="#0a8a4a" opacity="0.16" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <!-- 圆形：cx=240/cy=128 设置圆心坐标，r=68 控制半径，fill=#0a8a4a 调整填充色 -->
  <circle cx="240" cy="128" r="68" fill="#0a8a4a" opacity="0.12" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#13b067 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M90 112h72v44c0 18-16 34-36 34s-36-16-36-34z" fill="#13b067" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#de8c34 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M198 86h92v64c0 28-24 50-46 50s-46-22-46-50z" fill="#de8c34" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#0a8a4a 配合 stroke-width=6 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M260 86c16 0 32 10 32 28s-16 28-32 28" fill="none" stroke="#0a8a4a" stroke-width="6" stroke-linecap="round" />
</svg>
