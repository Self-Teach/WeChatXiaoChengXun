<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：特产精选列表中的云南蜂蜜玫瑰酱插画。
    修改指引：如需替换罐体配色请同步调整标签与盖子路径的 fill，保留 200×200 画布以适配卡片。
  -->
  <defs>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <linearGradient id="pasteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <stop offset="0%" stop-color="#5c3317" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <stop offset="100%" stop-color="#b97a40" />
    </linearGradient>
  </defs>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <rect x="20" y="50" width="160" height="110" rx="24" fill="#f5e4d0" />
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <rect x="40" y="68" width="120" height="74" rx="18" fill="url(#pasteGradient)" />
  <!-- 分组元素，用于集合多个图形进行统一变换或样式控制 -->
  <g fill="#f7d7a3">
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <circle cx="70" cy="105" r="10" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <circle cx="100" cy="105" r="10" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <circle cx="130" cy="105" r="10" />
  </g>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M60 150h80c4 0 8 3 8 8s-4 8-8 8H60c-4 0-8-3-8-8s4-8 8-8z" fill="#c28f57" opacity="0.6" />
</svg>
