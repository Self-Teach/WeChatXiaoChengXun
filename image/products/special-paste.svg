<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=200、height=200 控制导出尺寸，viewBox=0 0 200 200 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：特产精选列表中的云南蜂蜜玫瑰酱插画。
    修改指引：如需替换罐体配色请同步调整标签与盖子路径的 fill，保留 200×200 画布以适配卡片。
  -->
  <!-- <defs> 节点用于存放渐变或滤镜等复用资源，不使用时可整块删除 -->
  <defs>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <!-- 定义线性渐变 pasteGradient，x1/y1 与 x2/y2 控制光线方向，适当修改可调节高光位置 -->
    <linearGradient id="pasteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=0% 决定过渡百分比，stop-color=#5c3317 设置该处颜色，可结合品牌色调整 -->
      <stop offset="0%" stop-color="#5c3317" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <!-- 渐变节点：offset=100% 决定过渡百分比，stop-color=#b97a40 设置该处颜色，可结合品牌色调整 -->
      <stop offset="100%" stop-color="#b97a40" />
    </linearGradient>
  </defs>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=20/y=50 定位左上角，width=160/height=110 设定大小，rx=24 控制圆角弧度，fill=#f5e4d0 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect x="20" y="50" width="160" height="110" rx="24" fill="#f5e4d0" />
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=40/y=68 定位左上角，width=120/height=74 设定大小，rx=18 控制圆角弧度，fill=url(#pasteGradient) 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect x="40" y="68" width="120" height="74" rx="18" fill="url(#pasteGradient)" />
  <!-- 分组元素，用于集合多个图形进行统一变换或样式控制 -->
  <!-- <g> 分组标签便于一次性移动或缩放内部多个元素，也可统一修改透明度 -->
  <g fill="#f7d7a3">
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <!-- 圆形：cx=70/cy=105 设置圆心坐标，r=10 控制半径 -->
    <circle cx="70" cy="105" r="10" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <!-- 圆形：cx=100/cy=105 设置圆心坐标，r=10 控制半径 -->
    <circle cx="100" cy="105" r="10" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <!-- 圆形：cx=130/cy=105 设置圆心坐标，r=10 控制半径 -->
    <circle cx="130" cy="105" r="10" />
  </g>
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#c28f57 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M60 150h80c4 0 8 3 8 8s-4 8-8 8H60c-4 0-8-3-8-8s4-8 8-8z" fill="#c28f57" opacity="0.6" />
</svg>
