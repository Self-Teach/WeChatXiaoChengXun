<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=360、height=240 控制导出尺寸，viewBox=0 0 360 240 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="360" height="240" viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品详情页“原料甄选”模块的叶片插图。
    修改指引：调整叶子颜色时请修改两个 <path> 的 fill，保持 360×240 画布比例以与模块布局贴合。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=360/height=240 设定大小，rx=32 控制圆角弧度，fill=#f0f8f5 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="360" height="240" rx="32" fill="#f0f8f5" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#0a8a4a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M60 200c40-120 160-160 240-140-40 120-160 160-240 140z" fill="#0a8a4a" opacity="0.18" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#13b067 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M80 180c28-84 124-116 184-100-28 84-124 116-184 100z" fill="#13b067" opacity="0.6" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#6fdd9a 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M120 176c16-52 80-72 120-62-16 52-80 72-120 62z" fill="#6fdd9a" opacity="0.8" />
</svg>
