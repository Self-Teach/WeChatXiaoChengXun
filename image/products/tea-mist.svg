<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：茶叶精选分类中“冰岛古树”商品主图。
    修改指引：可变更山景或茶杯颜色营造雾气氛围，保持 320×320 画布以适配产品宫格。
  -->
  <defs>
  <!-- 定义线性渐变，提供更有层次的填充效果 -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="100%" y2="100%">
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <stop offset="0%" stop-color="#b3e5d1" />
    <!-- 渐变色的断点配置，决定颜色过渡 -->
      <stop offset="100%" stop-color="#0a8a4a" />
    </linearGradient>
  </defs>
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <rect width="320" height="320" rx="40" fill="#ecf8f2" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
  <circle cx="160" cy="140" r="90" fill="#d0efe1" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M96 212c32-36 116-36 128 0s-16 72-64 72-96-36-64-72z" fill="#0a8a4a" opacity="0.14" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <path d="M124 116h72v52c0 26-18 48-36 48s-36-22-36-48z" fill="url(#mist)" />
</svg>
