<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=360、height=240 控制导出尺寸，viewBox=0 0 360 240 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="360" height="240" viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：商品详情页“产地工艺”模块的茶饼插图。
    修改指引：更换茶饼配色时请修改饼面与背景圆环的 fill，保持 360×240 画布比例以与模块布局贴合。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=360/height=240 设定大小，rx=32 控制圆角弧度，fill=#fff5eb 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="360" height="240" rx="32" fill="#fff5eb" />
  <ellipse cx="180" cy="168" rx="140" ry="36" fill="#f4d7b5" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#de8c34 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M96 90h168v78c0 28-36 50-84 50s-84-22-84-50z" fill="#de8c34" />
  <ellipse cx="180" cy="90" rx="84" ry="28" fill="#f9c98b" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
  <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=none 控制内部颜色，stroke=#8c4d28 配合 stroke-width=8 调整线条颜色与粗细，stroke-linecap=round 控制端点形状；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
  <path d="M108 120h144" stroke="#8c4d28" stroke-width="8" stroke-linecap="round" opacity="0.6" />
</svg>
