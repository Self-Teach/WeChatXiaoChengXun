<!-- 定义图标画布尺寸与命名空间，便于了解资源属性 -->
<!-- SVG 根节点：width=200、height=200 控制导出尺寸，viewBox=0 0 200 200 决定坐标系统；等比调整可避免拉伸失真 -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!--
    图标用途：特产精选列表中的普洱茶点插画。
    修改指引：调整糕点或托盘颜色时需同步更新多个 <path> 填充，确保阴影留白维持立体感。
  -->
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
  <!-- 矩形：x=0/y=0 定位左上角，width=200/height=200 设定大小，rx=28 控制圆角弧度，fill=#fff6e8 调整填充，可换成 url(#gradient) 或十六进制色值 -->
  <rect width="200" height="200" rx="28" fill="#fff6e8" />
  <!-- 分组元素，用于集合多个图形进行统一变换或样式控制 -->
  <!-- <g> 分组标签便于一次性移动或缩放内部多个元素，也可统一修改透明度 -->
  <g transform="translate(40 60)">
    <ellipse cx="40" cy="40" rx="36" ry="28" fill="#f1a661" />
    <ellipse cx="40" cy="40" rx="28" ry="20" fill="#f9d6a2" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <!-- 圆形：cx=40/cy=34 设置圆心坐标，r=8 控制半径，fill=#e46b6b 调整填充色 -->
    <circle cx="40" cy="34" r="8" fill="#e46b6b" />
  <!-- 绘制自定义路径线条，描述图标的关键造型 -->
    <!-- 路径：d 属性记录笔划坐标，可在矢量软件中编辑；fill=#d3834c 控制内部颜色；需要重新布形状时可直接修改 d 中的数值或导出新路径 -->
    <path d="M12 70h56c6 0 10 4 10 10s-4 10-10 10H12c-6 0-10-4-10-10s4-10 10-10z" fill="#d3834c" opacity="0.65" />
  </g>
  <!-- 分组元素，用于集合多个图形进行统一变换或样式控制 -->
  <!-- <g> 分组标签便于一次性移动或缩放内部多个元素，也可统一修改透明度 -->
  <g transform="translate(100 48)">
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
    <!-- 矩形：x=6/y=20 定位左上角，width=60/height=60 设定大小，rx=16 控制圆角弧度，fill=#f7c97f 调整填充，可换成 url(#gradient) 或十六进制色值 -->
    <rect x="6" y="20" width="60" height="60" rx="16" fill="#f7c97f" />
  <!-- 绘制矩形区域，通常用于背景或装饰块 -->
    <!-- 矩形：x=20/y=34 定位左上角，width=32/height=32 设定大小，rx=10 控制圆角弧度，fill=#ffe7c7 调整填充，可换成 url(#gradient) 或十六进制色值 -->
    <rect x="20" y="34" width="32" height="32" rx="10" fill="#ffe7c7" />
  <!-- 绘制圆形轮廓或背景，突出主要视觉焦点 -->
    <!-- 圆形：cx=36/cy=50 设置圆心坐标，r=6 控制半径，fill=#d46c4f 调整填充色 -->
    <circle cx="36" cy="50" r="6" fill="#d46c4f" />
  </g>
</svg>
